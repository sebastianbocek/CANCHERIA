name: Actualizar contadores de descargas

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * *"
  release:
    types: [published, edited, deleted]

permissions:
  contents: write

concurrency:
  group: download-badges
  cancel-in-progress: true

jobs:
  update:
    name: Contar instaladores publicados
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Actualizar badges acumulados
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          api_path="repos/${GITHUB_REPOSITORY}/releases?per_page=100"

          sum_asset_downloads() {
            local asset_name="$1"
            gh api --paginate "$api_path" \
              --jq ".[] | .assets[]? | select(.name == \"${asset_name}\") | .download_count" \
              | awk '{ total += $1 } END { print total + 0 }'
          }

          windows_downloads="$(sum_asset_downloads "InstaladorCancheria.exe")"
          linux_downloads="$(sum_asset_downloads "InstaladorCancheriaLinux.run")"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git ls-remote --exit-code --heads origin badges >/dev/null 2>&1; then
            git fetch origin badges
            git switch --force-create badges origin/badges
          else
            git switch --orphan badges
            git rm -rf . >/dev/null 2>&1 || true
          fi

          curl --fail --silent --show-error --location \
            "https://img.shields.io/badge/Windows-${windows_downloads}%20descargas-1673FF?style=for-the-badge&logo=windows11&logoColor=white" \
            --output windows-downloads.svg

          curl --fail --silent --show-error --location \
            "https://img.shields.io/badge/Debian%20%2F%20Linux-${linux_downloads}%20descargas-D70A53?style=for-the-badge&logo=debian&logoColor=white" \
            --output linux-downloads.svg

          rm -f windows-downloads.json linux-downloads.json
          git add --all

          if git diff --cached --quiet; then
            echo "Los contadores ya estaban actualizados."
            exit 0
          fi

          git commit -m "Actualizar contadores de descargas"
          git push origin badges
