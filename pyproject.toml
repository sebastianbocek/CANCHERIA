[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cancheria"
version = "0.2.16"
description = "Free AI reservation agent for sports facilities"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "playwright>=1.40.0",
  "openai>=1.0.0",
  "pytz>=2023.3",
  "python-dateutil>=2.8.2",
  "croniter>=1.4.1",
  "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]
build = ["pyinstaller>=6.10"]

[project.scripts]
cancheria = "cancheria.cli:main"
cancheria-gui = "cancheria.desktop.gui:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
markers = [
  "unit: pure unit tests",
  "integration: local integration tests",
  "live: requires external services",
  "browser: requires a real browser/profile",
]
