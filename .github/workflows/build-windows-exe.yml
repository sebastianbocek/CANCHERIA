name: Build Windows desktop apps

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -e ".[build]"

      - name: Create build folders
        shell: cmd
        run: |
          if not exist build\spec mkdir build\spec

      - name: Build cancheria.exe in repository root
        shell: cmd
        run: >-
          python -m PyInstaller --noconfirm --clean --onefile --windowed
          --name cancheria
          --distpath "%CD%"
          --workpath "%CD%\build\pyinstaller-cancheria"
          --specpath "%CD%\build\spec"
          --icon "%CD%\assets\cancheria.ico"
          --paths "%CD%\src"
          --hidden-import openai
          --hidden-import playwright.async_api
          --hidden-import pytz
          --hidden-import dotenv
          "%CD%\cancheria_desktop.py"

      - name: Build configurador_cancheria.exe in repository root
        shell: cmd
        run: >-
          python -m PyInstaller --noconfirm --clean --onefile --windowed
          --name configurador_cancheria
          --distpath "%CD%"
          --workpath "%CD%\build\pyinstaller-configurador"
          --specpath "%CD%\build\spec"
          --icon "%CD%\assets\cancheria.ico"
          --paths "%CD%\src"
          "%CD%\configurador_cancheria.py"

      - name: Verify executables
        shell: cmd
        run: |
          if not exist cancheria.exe exit /b 1
          if not exist configurador_cancheria.exe exit /b 1

      - name: Assemble release
        run: python scripts/assemble_windows_release.py

      - name: Upload Windows ZIP
        uses: actions/upload-artifact@v4
        with:
          name: CANCHERIA-Windows
          path: release/CANCHERIA_WINDOWS.zip
